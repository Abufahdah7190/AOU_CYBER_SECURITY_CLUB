<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور - CyberClub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app auth-page">
    <section class="panel auth-panel" style="display:block">
      <div class="auth-shell">
        <div class="auth-heading"><span class="auth-kicker">CYBERCLUB ACCOUNT</span><h1>إعادة تعيين كلمة المرور</h1><p>أنشئ كلمة مرور جديدة وآمنة لحسابك.</p></div>
        <div class="auth-message" id="reset-message" role="status" aria-live="polite"></div>
        <form class="auth-form" id="reset-form" novalidate>
          <div class="auth-field">
            <label for="new-password">كلمة المرور الجديدة</label>
            <input id="new-password" name="newPassword" type="password" required minlength="10" autocomplete="new-password">
            <div class="meter" style="margin-top:8px"><i id="reset-pw-meter"></i></div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;">
              <small id="reset-pw-hint">10 أحرف على الأقل، وتتضمن حرفًا كبيرًا وحرفًا صغيرًا ورقمًا.</small>
              <span class="score" id="reset-pw-score-label">—</span>
            </div>
            <div id="reset-pw-checks" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px;"></div>
          </div>
          <div class="auth-field"><label for="confirm-password">تأكيد كلمة المرور</label><input id="confirm-password" type="password" required minlength="10" autocomplete="new-password"><small id="reset-pw-match-hint"></small></div>
          <button class="btn primary auth-submit" type="submit" id="reset-submit" disabled>حفظ كلمة المرور الجديدة</button>
        </form>
        <p class="auth-back-home"><a href="index.html">العودة إلى الموقع</a></p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script><script src="/js/api-client.js"></script>
  <script src="js/password-analysis.js"></script>
  <script src="js/reset-password.js"></script>
<script src="/js/locales.js"></script><script src="/js/i18n.js"></script><script src="/js/page-i18n.js"></script></body>
</html>
