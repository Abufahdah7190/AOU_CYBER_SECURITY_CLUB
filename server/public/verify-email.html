<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>التحقق من البريد — نادي الأمن السيبراني</title>
  <link rel="stylesheet" href="css/verify-email.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/supabase-client.js"></script>
  <script defer src="js/verify-email.js?v=20260910-otp"></script>
</head>
<body>
  <main>
    <small>CYBERCLUB / AOU</small>
    <h1>أدخل رمز التحقق</h1>
    <p id="verify-intro">أرسلنا رمزًا مكوّنًا من 6 أرقام إلى بريدك الجامعي. أدخله أدناه لتفعيل الدخول والانتقال إلى صفحة النادي.</p>
    <p id="pending-email" dir="ltr"></p>
    
    <form id="otp-form" novalidate>
      <div class="otp-boxes" dir="ltr" role="group" aria-label="رمز التحقق المكوّن من 6 أرقام">
        <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 1">
        <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="الرقم 2">
        <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="الرقم 3">
        <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="الرقم 4">
        <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="الرقم 5">
        <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="الرقم 6">
      </div>
      <button id="confirm-login" type="submit">تأكيد الدخول</button>
    </form>
    
    <p id="verify-status" role="status" aria-live="polite"></p>
    <p>إذا لم تجد الرسالة، افحص البريد غير المرغوب فيه. الرمز صالح لفترة محدودة فقط.</p>
    <button id="resend" type="button">إعادة إرسال الرمز</button>
    <a href="index.html">العودة لتسجيل الدخول أو تغيير البريد</a>
  </main>
</body>
</html>
