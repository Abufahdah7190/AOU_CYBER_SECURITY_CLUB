<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور - CyberClub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app auth-page">
    <section class="panel auth-panel" style="display:block">
      <div class="auth-shell">
        <div class="auth-heading"><span class="auth-kicker">CYBERCLUB ACCOUNT</span><h1>إعادة تعيين كلمة المرور</h1><p>أنشئ كلمة مرور جديدة وآمنة لحسابك.</p></div>
        <div class="auth-message" id="reset-message" role="status" aria-live="polite"></div>
        <form class="auth-form" id="reset-form" novalidate>
          <div class="auth-field"><label for="new-password">كلمة المرور الجديدة</label><input id="new-password" name="newPassword" type="password" required minlength="10" autocomplete="new-password"><small>10 أحرف على الأقل، وتتضمن حرفًا كبيرًا وحرفًا صغيرًا ورقمًا.</small></div>
          <div class="auth-field"><label for="confirm-password">تأكيد كلمة المرور</label><input id="confirm-password" type="password" required minlength="10" autocomplete="new-password"></div>
          <button class="btn primary auth-submit" type="submit">حفظ كلمة المرور الجديدة</button>
        </form>
        <p class="auth-back-home"><a href="index.html">العودة إلى الموقع</a></p>
      </div>
    </section>
  </main>
  <script src="js/reset-password.js"></script>
</body>
</html>
