services:
  db:
    image: postgres:16-alpine
    container_name: cyberclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cyberclub
    ports:
      - "5432:5432"
    volumes:
      - cyberclub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberclub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cyberclub-postgres-data:
