<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة واجهة المصادقة - CyberClub</title>
<style>
:root{--bg:#050b18;--panel:#0b162b;--line:#1c3857;--text:#e9f6ff;--muted:#8ba2bb;--cyan:#00e5ff;--green:#00ff9d;--danger:#ff5577}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#123051 0,#050b18 42%);color:var(--text);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}.preview{width:min(100%,760px)}.brand{text-align:center;margin-bottom:20px}.brand small{color:var(--cyan);letter-spacing:3px;font-weight:bold}.brand h1{margin:9px 0 4px;font-size:clamp(23px,4vw,34px)}.brand p{margin:0;color:var(--muted)}.card{background:linear-gradient(145deg,rgba(15,34,60,.96),rgba(7,18,34,.98));border:1px solid var(--line);border-radius:20px;padding:clamp(20px,5vw,42px);box-shadow:0 20px 70px #0008}.switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px;background:#020812;border:1px solid var(--line);border-radius:12px;margin-bottom:22px}.switch button,.link{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:8px;cursor:pointer;font:inherit}.switch button.active{background:#063d52;color:var(--text);box-shadow:0 0 18px #00e5ff22}.form{display:none}.form.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:#020a15;color:var(--text);font:inherit;outline:0}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #00e5ff18}.field small{display:block;color:var(--muted);font-size:11px;line-height:1.7;margin-top:6px}.primary{width:100%;border:0;border-radius:9px;padding:13px;background:linear-gradient(90deg,#00bcd4,var(--cyan));color:#00111a;font-weight:bold;cursor:pointer;font:inherit}.link{display:block;margin:10px auto 0;color:var(--cyan);font-size:13px}.notice{min-height:24px;color:var(--green);font-size:13px;margin:0 0 10px}.preview-note{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}@media(max-width:560px){.grid{grid-template-columns:1fr;gap:0}}
</style></head>
<body><main class="preview"><header class="brand"><small>CYBERCLUB ACCOUNT</small><h1>واجهة المصادقة</h1><p>معاينة تفاعلية لتسجيل الدخول وإنشاء الحساب</p></header><section class="card"><div class="switch"><button class="active" data-view="login">تسجيل الدخول</button><button data-view="register">إنشاء حساب</button></div><p class="notice" id="notice" aria-live="polite"></p><form class="form active" id="login"><div class="field"><label>البريد الإلكتروني الجامعي</label><input type="email" placeholder="name@aou.edu.sa"></div><div class="field"><label>كلمة المرور</label><input type="password" placeholder="••••••••"></div><button class="primary" type="submit">دخول آمن</button><button class="link" type="button" data-view="forgot">نسيت كلمة المرور؟</button></form><form class="form" id="register"><div class="grid"><div class="field"><label>الاسم الأول</label><input placeholder="أحمد"></div><div class="field"><label>اسم العائلة</label><input placeholder="العتيبي"></div></div><div class="field"><label>البريد الإلكتروني الجامعي</label><input type="email" placeholder="name@aou.edu.sa"></div><div class="grid"><div class="field"><label>رقم الهاتف</label><input placeholder="05xxxxxxxx"></div><div class="field"><label>التخصص</label><input placeholder="الأمن السيبراني"></div></div><div class="field"><label>كلمة المرور</label><input type="password" placeholder="10 أحرف على الأقل"><small>تتضمن حرفًا كبيرًا وحرفًا صغيرًا ورقمًا.</small></div><button class="primary" type="submit">إنشاء الحساب</button></form><form class="form" id="forgot"><div class="field"><label>البريد الإلكتروني الجامعي</label><input type="email" placeholder="name@aou.edu.sa"></div><button class="primary" type="submit">إرسال رابط الاستعادة</button><button class="link" type="button" data-view="login">العودة إلى تسجيل الدخول</button></form></section><p class="preview-note">هذه صفحة معاينة تصميمية؛ النماذج فيها لا ترسل بيانات فعلية.</p></main><script>const buttons=document.querySelectorAll('[data-view]'),forms=document.querySelectorAll('.form'),notice=document.getElementById('notice');function show(view){forms.forEach(f=>f.classList.toggle('active',f.id===view));document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));notice.textContent=''}buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();notice.textContent='هذه معاينة فقط — لن يتم إرسال البيانات.'}))</script></body></html>
